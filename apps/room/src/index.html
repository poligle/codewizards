<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>CodeWizards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>CodeWizards <span id="mode">demo</span></h1>
  <div class="ctrls">
    <div class="seg" role="group" aria-label="Velocidad de la simulación">
      <button type="button" data-speed="1" aria-pressed="true">×1</button><button type="button" data-speed="2" aria-pressed="false">×2</button><button type="button" data-speed="4" aria-pressed="false">×4</button>
    </div>
    <label class="chk"><input type="checkbox" id="auto"> Aprobar solo</label>
    <button type="button" class="switch" id="crt" aria-pressed="true"><span class="knob" aria-hidden="true"></span>CRT</button>
  </div>
</header>
<main class="layout" id="layout">
  <aside class="panel side" id="left" aria-labelledby="h-tasks">
    <h2 id="h-tasks">Tareas</h2>
    <h3>En curso</h3>
    <ol id="tasks" class="tasks"></ol>
    <details class="hist" id="hist"><summary>Hechas (<span id="hist-n">0</span>)</summary><ol id="history" class="tasks"></ol></details>
    <h3><label for="notes">Por hacer</label></h3>
    <textarea id="notes" rows="6" placeholder="Ideas para próximos hechizos. Escribe, selecciona una línea y pásala al grimorio."></textarea>
    <button type="button" id="to-spell" class="mini">Al grimorio</button>
    <h3>Maná por cuenta</h3>
    <ul id="mana" class="mana"></ul>
    <p id="status" class="status" aria-live="polite"></p>
  </aside>
  <div class="split" id="split-left" data-side="left" role="separator" aria-orientation="vertical" aria-label="Ancho del panel de tareas" tabindex="0"></div>
  <section class="center" aria-label="Sala y grimorio">
    <div class="panel sala">
      <div class="tv"><div class="screen crt" id="screen">
        <canvas id="room" width="208" height="152" role="img" aria-label="Sala de la torre: los magos entran, leen, escriben y presentan"></canvas>
        <canvas id="bloom" class="fx" width="208" height="152" aria-hidden="true"></canvas>
        <div class="fx mask"></div><div class="fx scan"></div><div class="fx vig"></div>
      </div></div>
      <p class="hint" id="hint">Escribe un hechizo y pulsa «Lanzar». Datos simulados: no se llama a ninguna API.</p>
    </div>
    <section class="panel grim" aria-labelledby="h-grim">
      <h2 id="h-grim">Grimorio</h2>
      <form id="spell">
        <label for="spell-text" class="sr-only">Hechizo</label>
        <textarea id="spell-text" rows="2" placeholder="Describe lo que quieres que hagan los magos"></textarea>
        <div class="opts">
          <label>Quién lo hace
            <select id="rank">
              <option value="auto" selected>Que decida el Archimago</option>
              <option value="aprendiz">Aprendiz</option>
              <option value="joven">Mago Joven</option>
              <option value="sabio">Gran Sabio</option>
            </select>
          </label>
          <label>Modelo
            <select id="model"><option value="auto" selected>El de su rango</option></select>
          </label>
          <label>Esfuerzo
            <select id="effort">
              <option value="auto" selected>El de su rango</option>
              <option value="low">Bajo</option>
              <option value="medium">Medio</option>
              <option value="high">Alto</option>
              <option value="xhigh">Muy alto</option>
              <option value="max">Máximo</option>
            </select>
          </label>
          <button type="submit" class="cast">Lanzar</button>
        </div>
      </form>
    </section>
  </section>
  <div class="split" id="split-right" data-side="right" role="separator" aria-orientation="vertical" aria-label="Ancho del panel de la pizarra" tabindex="0"></div>
  <aside class="panel side" id="right" aria-labelledby="h-piz">
    <h2 id="h-piz">Pizarra</h2>
    <div id="deliv" class="deliv"></div>
    <label for="comment" class="cm">Comentario para el mago si rechazas</label>
    <textarea id="comment" rows="2" maxlength="2000"></textarea>
    <div class="review"><button type="button" id="approve" class="ok" disabled>Aprobar</button><button type="button" id="reject" class="no" disabled>Rechazar</button><button type="button" id="stop" class="halt" disabled hidden>Detener</button></div>
    <h3>Pergamino</h3>
    <ol id="log" class="log" aria-label="Registro de eventos"></ol>
  </aside>
</main>
<p id="live" class="sr-only" aria-live="polite"></p>
<script src="assets.gen.js"></script>
<script src="world.js"></script>
<script src="sim.js"></script>
<script src="render.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
