name: secrets

# Secret scan with gitleaks.
# - push / pull_request: scans only the commits that arrive.
# - workflow_dispatch / schedule: scans the whole history of every branch.
# Run it by hand (Actions > secrets > Run workflow) after the first push of a
# new repo or after rewriting history (git filter-repo + force push): those
# pushes start at the root commit, and gitleaks-action builds the range
# "<first>^..<last>", which does not exist for a root commit, so the push scan
# fails with "unknown revision" without scanning anything.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    # Skip Dependabot's own pushes and PRs, but never the full scans.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # inline comment on the PR when a leak is found
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action defaults to gitleaks 8.24.3, which has no rule for
          # Anthropic API keys (added in 8.28.0). Bump by hand.
          GITLEAKS_VERSION: 8.30.1
