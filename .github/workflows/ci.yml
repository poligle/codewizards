name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (immutable); Dependabot keeps the SHA
# and the version comment up to date. The secret scan lives in secrets.yml.

jobs:
  art:
    name: Art (GBC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codewizards-art/04_source/requirements.txt
      - run: pip install -r codewizards-art/04_source/requirements.txt
      - name: Validate assets
        run: python3 codewizards-art/04_source/gen/check.py

  mockup:
    name: Mockup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codewizards-art/04_source/requirements.txt
      - run: pip install -r codewizards-art/04_source/requirements.txt
      - name: JavaScript syntax
        run: for f in apps/maqueta/src/*.js; do node --check "$f"; done
      - name: Logic and event contract v0
        run: node apps/maqueta/test/maqueta.test.mjs
      - name: maqueta.html is up to date
        run: python3 apps/maqueta/build.py --check
