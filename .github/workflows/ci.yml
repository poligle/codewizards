name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (immutable); Dependabot keeps the SHA and the version
# comment up to date. The secret scan lives in secrets.yml and the demo deploy in pages.yml.
# A push to main whose package.json carries a new version also publishes a GitHub release (job
# `release`), once everything else is green.

jobs:
  art:
    name: Art (GBC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codewizards-art/04_source/requirements.txt
      - run: pip install -r codewizards-art/04_source/requirements.txt
      - name: Validate assets (and no orphans)
        run: python3 codewizards-art/04_source/gen/check.py

  room:
    name: Room
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codewizards-art/04_source/requirements.txt
      - run: pip install -r codewizards-art/04_source/requirements.txt
      - name: JavaScript syntax
        run: for f in apps/room/src/*.js; do node --check "$f"; done
      - name: Room logic and event contract v1
        run: node apps/room/test/room.test.mjs
      - name: assets.gen.js is up to date
        run: python3 apps/room/build.py --check
      - name: The glossary and the pages' terms match the tower's words
        run: node tools/glossary.mjs --check
      - name: Panel colours reach WCAG 2.2 AA contrast in both themes
        run: node tools/contrast.mjs

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Core, contract and room tests
        run: npm test

  evals:
    name: Evals (bank and pipeline, no tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Every task fails before and passes with its reference solution
        run: node tools/evals.mjs --self-check
      - name: The Archmage's rules against the task labels
        run: node tools/evals.mjs --routing
      - name: The whole pipeline with a fake agent that applies the solutions
        run: node tools/evals.mjs --oracle --configs sonnet,archimago --tasks all --out "$RUNNER_TEMP/evals"

  smoke:
    name: Smoke (Chromium, installed package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Pack the app and install it as a user would
        run: |
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/app"
          # Outside the lockfile on purpose: this is what a user's install resolves (ws is pinned
          # exactly). zizmor reports it as adhoc-packages (low); accepted in auditorias/software.md.
          npm install --prefix "$RUNNER_TEMP/app" --ignore-scripts --no-audit --no-fund ./codewizards-*.tgz
          "$RUNNER_TEMP/app/node_modules/.bin/codewizards" --version
      - name: Smoke test (static demo, phone, and the installed core)
        run: node tools/smoke.mjs --browser chromium --bin "$RUNNER_TEMP/app/node_modules/codewizards/apps/core/bin/codewizards.js"
      - name: Screenshots and the test package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke
          path: |
            tools/smoke/out/
            codewizards-*.tgz
          retention-days: 14

  # Zen and the other Firefox-based browsers. Not blocking until it has been green once.
  smoke-firefox:
    name: Smoke (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Firefox for Playwright
        run: npx playwright install --with-deps firefox
      - name: Smoke test in Firefox
        run: node tools/smoke.mjs --browser firefox
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-firefox
          path: tools/smoke/out/
          retention-days: 14

  release:
    name: Release (new version on main)
    needs: [art, room, core, evals, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Version in package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish the release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released: nothing to do."
            exit 0
          fi
          node tools/release-notes.mjs "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          npm pack --silent
          gh release create "$TAG" codewizards-*.tgz --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
