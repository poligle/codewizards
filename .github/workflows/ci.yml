name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  art:
    name: Art (GBC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codewizards-art/04_source/requirements.txt
      - run: pip install -r codewizards-art/04_source/requirements.txt
      - name: Validate assets
        run: python3 codewizards-art/04_source/gen/check.py

  mockup:
    name: Mockup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codewizards-art/04_source/requirements.txt
      - run: pip install -r codewizards-art/04_source/requirements.txt
      - name: JavaScript syntax
        run: for f in apps/maqueta/src/*.js; do node --check "$f"; done
      - name: Logic and event contract v0
        run: node apps/maqueta/test/maqueta.test.mjs
      - name: maqueta.html is up to date
        run: python3 apps/maqueta/build.py --check

  secrets:
    name: Secrets (gitleaks)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
