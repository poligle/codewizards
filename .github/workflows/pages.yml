name: pages

# Publishes codewizards.app (step 8): the page in site/ and the room's demo in /demo/, as
# tools/site.mjs builds them. Needs Settings → Pages → Build and deployment → Source: "GitHub
# Actions"; the custom domain is set there too (docs/web.md has the steps). No configure-pages
# step: a plain static site does not need it, and the build job keeps read-only permissions.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/room/src/**'
      - 'apps/core/src/words.js'
      - 'codewizards-art/05_ui/**'
      - 'tools/site.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site and the demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build _site (no dependencies needed)
        run: node tools/site.mjs build _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
