name: pages

# Publishes only the room demo (apps/room/src) to GitHub Pages, instead of the whole repository.
# Needs Settings → Pages → Source: "GitHub Actions". The old mockup URL redirects to the demo.

on:
  push:
    branches: [main]
    paths:
      - 'apps/room/src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble _site
        run: |
          mkdir -p _site/apps/maqueta
          cp apps/room/src/index.html apps/room/src/style.css apps/room/src/*.js _site/
          cat > _site/apps/maqueta/maqueta.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>CodeWizards</title>
          <meta http-equiv="refresh" content="0; url=../../">
          <p>The demo moved: <a href="../../">open it here</a>.</p>
          HTML
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
